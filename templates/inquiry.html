<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>문의하기 - 김준석 포트폴리오</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 50px auto; line-height: 1.6; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; cursor: pointer; }
        #result { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
    </style>
</head>
<body>
    <h1>✉️ 문의 남기기</h1>
    <p>협업 제안이나 궁금한 점을 남겨주세요.</p>
    
    <div class="form-group">
        <label for="email">이메일 주소</label>
        <input type="email" id="email" placeholder="example@email.com">
    </div>
    <button onclick="sendInquiry()">전송하기</button>

    <div id="result"></div>

    <script>
        async function sendInquiry() {
            const emailValue = document.getElementById('email').value;
            const resultDiv = document.getElementById('result');

            // 준석 님이 만든 TADD API로 데이터 전송
            const response = await fetch('/api/contact', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: emailValue })
            });

            const data = await response.json();

            resultDiv.style.display = 'block';
            if (data.success) {
                resultDiv.style.backgroundColor = '#d4edda';
                resultDiv.innerText = data.message;
            } else {
                resultDiv.style.backgroundColor = '#f8d7da';
                resultDiv.innerText = "에러: " + data.errors.join(", ");
            }
        }
    </script>
</body>
</html>
